<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mininet-WEB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <!-- Barra superior -->
        <header class="topbar">
            <div class="brand">
                <img src="images/mininet-web-logo.png" alt="Mininet-WEB" class="brand-logo">
                <span>Mininet-WEB</span>
            </div>

            <nav class="menu">
                <button>File</button>
                <button>View</button>
                <button>Run</button>
                <button>Tools</button>
                <button>Help</button>
            </nav>
        </header>

        <!-- area principal -->
        <main class="workspace">
            <div class="workspace-header">
                <div>
                    <span class="eyebrow">NETWORK TOPOLOGY</span>
                    <h1>Topology Editor</h1>
                </div>

                <div class="topology-info">
                    <span id="node-count">0 nós</span>
                    <span id="link-count">0 enlaces</span>
                </div>
            </div>

            <section id="canvas" class="canvas">
                <svg id="links-layer" class="links-layer"></svg>

                <!-- Os componentes criados pelo usuário serão inseridos aqui -->
                <div id="empty-state" class="empty-state">
                    <div class="empty-icon">+</div>
                    <strong>Build your topology</strong>
                    <span>Drag components from the palette to this area.</span>
                </div>
            </section>
        </main>

        <!-- painel inferior -->
        <footer class="bottom-panel">

            <section class="panel-section components-section">
                <div class="panel-title">Components</div>

                <div class="component-list">
                    <div class="component-tool" draggable="true" data-type="host">
                        <div class="component-icon host-icon">
                            <svg viewBox="0 0 48 48">
                                <rect x="7" y="6" width="34" height="25" rx="2"/>
                                <line x1="7" y1="31" x2="41" y2="31"/>
                                <line x1="19" y1="37" x2="29" y2="37"/>
                                <line x1="24" y1="31" x2="24" y2="37"/>
                                <path d="M16 42h16"/>
                            </svg>
                        </div>
                        <span>Host</span>
                    </div>

                    <div class="component-tool" draggable="true" data-type="switch">
                        <div class="component-icon switch-icon">
                            <svg viewBox="0 0 48 48">
                                <rect x="5" y="10" width="38" height="28" rx="3"/>
                                <path d="M13 20l7 4-7 4"/>
                                <path d="M35 20l-7 4 7 4"/>
                                <line x1="20" y1="24" x2="28" y2="24"/>
                            </svg>
                        </div>
                        <span>Switch</span>
                    </div>

                    <div class="component-tool" draggable="true" data-type="controller">
                        <div class="component-icon controller-icon">
                            <svg viewBox="0 0 48 48">
                                <rect x="9" y="5" width="30" height="38" rx="2"/>
                                <line x1="14" y1="13" x2="34" y2="13"/>
                                <line x1="14" y1="20" x2="34" y2="20"/>
                                <line x1="14" y1="27" x2="34" y2="27"/>
                                <circle cx="16" cy="35" r="2"/>
                                <circle cx="24" cy="35" r="2"/>
                                <circle cx="32" cy="35" r="2"/>
                            </svg>
                        </div>
                        <span>Controller</span>
                    </div>

                    <div class="component-tool" draggable="true" data-type="router">
                        <div class="component-icon router-icon">
                            <svg viewBox="0 0 48 48">
                                <circle cx="24" cy="24" r="17"/>
                                <line x1="15" y1="15" x2="33" y2="33"/>
                                <line x1="33" y1="15" x2="15" y2="33"/>
                            </svg>
                        </div>
                        <span>Router</span>
                    </div>

                    <div class="component-tool" draggable="true" data-type="nat">
                        <div class="component-icon nat-icon">
                            <svg viewBox="0 0 48 48">
                                <path d="M14 36h22c6 0 9-4 9-9s-4-9-9-9c-1-7-6-11-12-11-6 0-11 4-12 10-6 0-10 4-10 10s5 9 12 9z"/>
                            </svg>
                        </div>
                        <span>NAT</span>
                    </div>
                </div>
            </section>

            <section class="panel-section actions-section">
                <div class="panel-title">Actions</div>

                <div class="actions-list">
                    <button id="pingall-btn" class="action-btn">
                        <span>◉</span>
                        Pingall Test
                    </button>

                    <button id="link-btn" class="action-btn">
                        <span>⌁</span>
                        Enlace
                    </button>

                    <button id="delete-btn" class="action-btn danger">
                        <span>⌫</span>
                        Delete Selected
                    </button>
                </div>
            </section>

        </footer>

        <div id="mode-indicator" class="mode-indicator hidden">
            <span class="mode-dot"></span>
            Click on two components, Press Esc to cancel.
            <button id="cancel-link">Cancel</button>
        </div>

        <div id="toast" class="toast"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
