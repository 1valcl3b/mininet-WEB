<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mininet-WEB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <!-- Barra superior -->
        <header class="topbar">
            <div class="brand">
                <img src="../images/mininet-web-logo.png" alt="Mininet-WEB" class="brand-logo">
                <span>Mininet-WEB</span>
            </div>

            <nav class="menu">
                <div class="menu-item">
                    <button id="file-menu-button" class="menu-button" data-menu-target="file-menu" aria-expanded="false" aria-haspopup="true">File</button>
                    <div id="file-menu" class="dropdown-menu" role="menu">
                        <button id="new-file-button" role="menuitem">New</button>
                        <button id="open-file-button" role="menuitem">Open...</button>
                        <button id="save-file-button" role="menuitem">Save</button>
                        <button id="save-as-button" role="menuitem">Save As...</button>
                        <button id="export-python-button" role="menuitem">Export topo.py</button>
                    </div>
                </div>
                <div class="menu-item">
                    <button class="menu-button" data-menu-target="view-menu" aria-expanded="false" aria-haspopup="true">View</button>
                    <div id="view-menu" class="dropdown-menu" role="menu">
                        <button id="split-view-button" role="menuitemcheckbox" aria-checked="false">Split</button>
                        <button id="toggle-grid-button" role="menuitem">Show Grid</button>
                        <button id="fit-topology-button" role="menuitem">Fit Topology</button>
                        <button id="clear-selection-button" role="menuitem">Clear Selection</button>
                    </div>
                </div>
                <div class="menu-item">
                    <button class="menu-button" data-menu-target="run-menu" aria-expanded="false" aria-haspopup="true">Run</button>
                    <div id="run-menu" class="dropdown-menu" role="menu">
                        <button id="run-pingall-button" role="menuitem">Pingall Test</button>
                        <button id="start-topology-button" role="menuitem">Start Topology</button>
                        <button id="stop-topology-button" role="menuitem">Stop Topology</button>
                    </div>
                </div>
                <div class="menu-item">
                    <button class="menu-button" data-menu-target="tools-menu" aria-expanded="false" aria-haspopup="true">Tools</button>
                    <div id="tools-menu" class="dropdown-menu" role="menu">
                        <button id="activate-link-button" role="menuitem">Create Link</button>
                        <button id="delete-selected-button" role="menuitem">Delete Selected</button>
                        <button id="reset-view-button" role="menuitem">Reset View</button>
                    </div>
                </div>
                <div class="menu-item">
                    <button class="menu-button" data-menu-target="help-menu" aria-expanded="false" aria-haspopup="true">Help</button>
                    <div id="help-menu" class="dropdown-menu" role="menu">
                        <button id="shortcuts-button" role="menuitem">Keyboard Shortcuts</button>
                        <button id="about-button" role="menuitem">About Mininet-WEB</button>
                    </div>
                </div>
            </nav>
        </header>

        <!-- area principal -->
        <main class="workspace">
            <div class="workspace-header">
                <div>
                    <span class="eyebrow">NETWORK TOPOLOGY</span>
                    <h1>Topology Editor</h1>
                </div>

                <div class="topology-info">
                    <span id="node-count">0 nós</span>
                    <span id="link-count">0 enlaces</span>
                </div>
            </div>

            <div id="workspace-content" class="workspace-content">
                <section id="canvas" class="canvas">
                    <svg id="links-layer" class="links-layer"></svg>
                    <div id="selection-box" class="selection-box"></div>

                    <div id="empty-state" class="empty-state">
                        <div class="empty-icon">+</div>
                        <strong>Build your topology</strong>
                        <span>Drag components from the palette to this area.</span>
                    </div>
                </section>
                <section id="python-panel" class="python-panel" aria-label="Código Python da topologia" hidden>
                    <div class="python-panel-header">
                        <strong>topo.py</strong>
                        <span id="python-status" class="python-status">Sincronizado</span>
                    </div>
                    <textarea id="python-code" class="python-code" aria-label="Código Python da topologia" spellcheck="false" wrap="off"></textarea>
                    <div class="python-panel-actions">
                        <button id="discard-python-button" type="button" disabled>Descartar edição</button>
                        <button id="apply-python-button" type="button" disabled>Aplicar código</button>
                    </div>
                </section>
            </div>
        </main>

        <!-- painel inferior -->
        <footer class="bottom-panel">

            <section class="panel-section components-section">
                <div class="panel-title">Components</div>

                <div id="component-list" class="component-list" aria-live="polite">
                    <span class="component-load-state">Carregando componentes...</span>
                </div>
            </section>

            <section class="panel-section actions-section">
                <div class="panel-title">Actions</div>

                <div class="actions-list">
                    <button id="pingall-btn" class="action-btn">
                        <span>◉</span>
                        Pingall Test
                    </button>

                    <button id="link-btn" class="action-btn">
                        <span>⌁</span>
                        Enlace
                    </button>

                    <button id="delete-btn" class="action-btn danger">
                        <span>⌫</span>
                        Delete Selected
                    </button>
                </div>
            </section>

        </footer>

        <div id="mode-indicator" class="mode-indicator hidden">
            <span class="mode-dot"></span>
            Click on two components, Press Esc to cancel.
            <button id="cancel-link">Cancel</button>
        </div>

        <div id="toast" class="toast"></div>
    </div>

    <input id="file-input" type="file" accept="application/json,.json" hidden>
    <script type="module" src="script.js"></script>
</body>
</html>
